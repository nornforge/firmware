# .github/workflows/release.yml
name: Firmware Release

on:
  push:
    tags:
      # Only release for version tags like v1.2.3
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the build provenance
      attestations: write  # store the build provenance
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 🔧 Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'
      - uses: acifani/setup-tinygo@f51bf108c9895381060398804ce6cf6f62692106 # v3.0.1
        with:
          tinygo-version: '0.44.0'
          install-binaryen: 'false'
      - name: 🧪 Test
        run: tinygo test -v ./...
      - name: 👷 Build firmware, SBOM and checksums
        run: ./scripts/build-release.sh "${GITHUB_REF_NAME}" dist
      - name: 📚 Changelog
        run: |
          go install github.com/goreleaser/chglog/cmd/chglog@v0.7.5
          chglog init
          chglog format --template release > "${RUNNER_TEMP}/CHANGELOG.txt"
      - name: 🔏 Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.uf2
            dist/*.cdx.json
      - name: 🎉 Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: ${{ runner.temp }}/CHANGELOG.txt
          files: |
            dist/*.uf2
            dist/*.cdx.json
            dist/checksums.txt
